name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Android project
        run: |
          mkdir -p android && cd android
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AS532Trainer"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'uz.squadron.as532trainer'
              compileSdk 34
              defaultConfig {
                  applicationId 'uz.squadron.as532trainer'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="@string/app_name" android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher" android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/uz/squadron/as532trainer
          cat > app/src/main/java/uz/squadron/as532trainer/MainActivity.java <<'EOF'
          package uz.squadron.as532trainer;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);   // keeps progress (localStorage)
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  // If a lesson is open, close it; otherwise leave the app
                  web.evaluateJavascript("(function(){var q=document.getElementById('quiz');if(q&&q.classList.contains('on')){quit();return 1}return 0})()",
                      v -> { if (!"1".equals(v)) MainActivity.super.onBackPressed(); });
              }
          }
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">AS532 Trainer</string></resources>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B2545" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFC21A" android:pathData="M18,34h72v5h-72z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M51,39h6v8h-6z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M30,47h40c8,0 14,6 14,14v4c0,6 -5,10 -11,10h-37c-7,0 -12,-5 -12,-12v-4c0,-7 3,-12 6,-12z"/>
              <path android:fillColor="#0B2545" android:pathData="M30,52h14v10h-18v-4c0,-3 2,-6 4,-6z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M82,55h14v4h-14z"/>
              <path android:fillColor="#FFC21A" android:pathData="M28,80h48v4h-48z"/>
          </vector>
          EOF
          mkdir -p app/src/main/assets
          cp ../index.html app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AS532Trainer.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AS532 Trainer ${{ github.run_number }}
          files: AS532Trainer.apk
